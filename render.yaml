services:
  - type: web
    name: vedd-trading-ai
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.1
      - key: TRADELOCKER_ENCRYPTION_KEY
        value: vedd-tl-default-key-change-me-32chars!!
